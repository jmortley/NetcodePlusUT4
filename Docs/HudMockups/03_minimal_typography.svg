<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2e22"/>
      <stop offset="1" stop-color="#1a140e"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="480" height="140" fill="url(#bg3)"/>

  <!-- HEALTH block -->
  <g transform="translate(170,86)" filter="url(#hardShadow)">
    <text x="0" y="0" text-anchor="end" font-family="'Segoe UI', Verdana, sans-serif" font-size="42" font-weight="300" fill="#ffffff" filter="url(#softGlow)" letter-spacing="-1">125</text>
    <text x="0" y="16" text-anchor="end" font-family="'Segoe UI', Verdana, sans-serif" font-size="9" font-weight="600" fill="#5fdc7a" letter-spacing="3">HEALTH</text>
    <line x1="-58" y1="6" x2="0" y2="6" stroke="#5fdc7a" stroke-width="1.5"/>
  </g>

  <!-- Vertical divider -->
  <line x1="240" y1="44" x2="240" y2="106" stroke="#5a4a32" stroke-width="1" opacity="0.5"/>

  <!-- ARMOR block -->
  <g transform="translate(310,86)" filter="url(#hardShadow)">
    <text x="0" y="0" text-anchor="start" font-family="'Segoe UI', Verdana, sans-serif" font-size="42" font-weight="300" fill="#ffffff" filter="url(#softGlow)" letter-spacing="-1">100</text>
    <text x="0" y="16" text-anchor="start" font-family="'Segoe UI', Verdana, sans-serif" font-size="9" font-weight="600" fill="#e3c542" letter-spacing="3">ARMOR</text>
    <line x1="0" y1="6" x2="58" y2="6" stroke="#e3c542" stroke-width="1.5"/>
  </g>

  <text x="240" y="132" text-anchor="middle" font-family="Verdana,sans-serif" font-size="9" fill="#888">03 — Minimal Typography (Valorant/CS2 inspired, no icons)</text>
</svg>
