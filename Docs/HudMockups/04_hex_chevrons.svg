<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2e22"/>
      <stop offset="1" stop-color="#1a140e"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="480" height="140" fill="url(#bg4)"/>

  <!--
    Chevron shape: parallelogram-ish with a slanted right edge.
    Path uses points: (0,0)-(W,0)-(W+S,H/2)-(W,H)-(0,H)-(S,H/2)
    With W=28 and S=8 -> overall span ~36 each
  -->

  <!-- HEALTH chevrons (left to right, 5 base + 1 overflow) -->
  <g transform="translate(40,38)">
    <!-- Filled health chevrons -->
    <g fill="#5fdc7a" filter="url(#glow4)">
      <path d="M 0,0 L 28,0 L 36,9 L 28,18 L 0,18 L 8,9 Z"/>
      <path d="M 38,0 L 66,0 L 74,9 L 66,18 L 38,18 L 46,9 Z"/>
      <path d="M 76,0 L 104,0 L 112,9 L 104,18 L 76,18 L 84,9 Z"/>
      <path d="M 114,0 L 142,0 L 150,9 L 142,18 L 114,18 L 122,9 Z"/>
      <path d="M 152,0 L 180,0 L 188,9 L 180,18 L 152,18 L 160,9 Z"/>
    </g>
    <!-- Overflow chevron — brighter cyan-tinged green -->
    <path d="M 190,0 L 218,0 L 226,9 L 218,18 L 190,18 L 198,9 Z" fill="#b9ffc6" stroke="#7df58f" stroke-width="1"/>
    <!-- Number on right -->
    <text x="244" y="15" font-family="Verdana,sans-serif" font-size="20" font-weight="700" fill="#7df58f" filter="url(#glow4)">125</text>
  </g>

  <!-- ARMOR chevrons -->
  <g transform="translate(40,82)">
    <g fill="#e3c542" filter="url(#glow4)">
      <path d="M 0,0 L 28,0 L 36,9 L 28,18 L 0,18 L 8,9 Z"/>
      <path d="M 38,0 L 66,0 L 74,9 L 66,18 L 38,18 L 46,9 Z"/>
      <path d="M 76,0 L 104,0 L 112,9 L 104,18 L 76,18 L 84,9 Z"/>
      <path d="M 114,0 L 142,0 L 150,9 L 142,18 L 114,18 L 122,9 Z"/>
      <path d="M 152,0 L 180,0 L 188,9 L 180,18 L 152,18 L 160,9 Z"/>
    </g>
    <!-- Empty 6th slot outline -->
    <path d="M 190,0 L 218,0 L 226,9 L 218,18 L 190,18 L 198,9 Z" fill="none" stroke="#4a4332" stroke-width="1"/>
    <text x="244" y="15" font-family="Verdana,sans-serif" font-size="20" font-weight="700" fill="#f5e07a" filter="url(#glow4)">100</text>
  </g>

  <text x="240" y="132" text-anchor="middle" font-family="Verdana,sans-serif" font-size="9" fill="#888">04 — Hex Chevrons (sci-fi/military, brighter overflow segment)</text>
</svg>
